version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: ft_db
    environment:
      POSTGRES_USER: username
      POSTGRES_PASSWORD: password
      POSTGRES_DB: financial_tracker_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ft_backend
    depends_on:
      - db
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://username:password@db:5432/financial_tracker_db
      # Pass through other keys from .env
      - SERP_API_KEY=${SERP_API_KEY}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - SECRET_KEY=${SECRET_KEY}
      - ALGORITHM=${ALGORITHM}
      - ACCESS_TOKEN_EXPIRE_MINUTES=${ACCESS_TOKEN_EXPIRE_MINUTES}
    env_file:
      - .env

  frontend:
    build:
      context: ./finance_tracker_frontend
      dockerfile: Dockerfile
    container_name: ft_frontend
    depends_on:
      - backend
    ports:
      - "80:80"
    environment:
      # This is build-time var for Vite, but Dockerfile needs to support ARG if we want to change it.
      # However, since it is a client-side app, it connects to localhost:8000 from the browser.
      - VITE_API_BASE_URL=http://localhost:8000

volumes:
  postgres_data:
